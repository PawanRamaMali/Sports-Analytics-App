name: CI

# R unit tests (testthat) and UI tests (pytest + Playwright driving the app
# in the runner's Chrome) on every push and pull request to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs Imports and Suggests from DESCRIPTION.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - name: R unit tests
        run: Rscript tests/testthat.R

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/ui/requirements-test.txt

      # Chrome is already on the runner (pytest.ini: --browser-channel
      # chrome), so no browser download.
      - name: Install UI test deps
        run: pip install -r tests/ui/requirements-test.txt
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: UI tests
        run: pytest tests/ui -v --junitxml test-results/results.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
