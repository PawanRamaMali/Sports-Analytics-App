name: CI

# R unit tests (testthat) and UI tests (pytest + Playwright driving the app
# in the runner's Chrome) on every push and pull request to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write   # the test results comment

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs Imports and Suggests from DESCRIPTION.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - name: R unit tests
        run: Rscript tests/testthat.R

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/ui/requirements-test.txt

      # Chrome is already on the runner (pytest.ini: --browser-channel
      # chrome), so no browser download.
      - name: Install UI test deps
        run: pip install -r tests/ui/requirements-test.txt
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Also writes test-results/summary.md (table of results), report.html
      # (the table with a screenshot of every test) and screenshots/.
      - name: UI tests
        run: pytest tests/ui -v --junitxml test-results/results.xml

      - name: Job summary
        if: ${{ !cancelled() && hashFiles('test-results/summary.md') != '' }}
        shell: bash
        run: cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        id: report
        if: ${{ !cancelled() && hashFiles('test-results/summary.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: test-results/
          retention-days: 14

      # One comment per PR, updated on every run. Fork PRs get a read-only
      # token, so a failure here does not fail the job.
      - name: Comment on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('test-results/summary.md') != '' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ui-test-report -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              fs.readFileSync('test-results/summary.md', 'utf8'),
              `📎 [HTML report with screenshots](${process.env.REPORT_URL}) (download, unzip, open \`report.html\`) · ` +
                `[Run log](${run}) · commit ${sha}`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments,
              { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const old = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
